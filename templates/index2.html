<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
</head>

<body>
    <div>
        <div id="myID">내 아이디: </div>
        <div id="otherID">상대 아이디: </div>
        <br />

        <button id="connect">연결</button>
        <div id="iceState">ICE상태</div>
        <div id="connectState">연결상태</div>
        <textarea id="messageInput" placeholder="여기에 메시지를 입력하세요" rows="4" cols="50"></textarea>
        <button id="sendMessage">메시지 전송</button>
    </div>

    <div id="chat"></div>

    <script>
        const socket = io.connect('http://127.0.0.1:5000');  // 서버 주소
        let pc;
        let dataChannel;

        function fetchIce() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'http://127.0.0.1:5000/ice', false);
            xhr.send(null);
            if (xhr.status !== 200) {
                console.error('ICE 서버 정보를 못 가져옴', xhr.status);
                return [];
            }

            const { iceServers } = JSON.parse(xhr.responseText);
            // turn 서버 항목에 dummy credential 추가
            return iceServers.map(s => {
                if (s.urls.startsWith('turn:')) {
                    return {
                        urls: s.urls,
                        username: 'user',        // 아무 문자열이나 OK
                        credential: 'pass'         // 아무 문자열이나 OK
                    };
                }
                return s;
            });
        }

        const iceServers = fetchIce();
        console.log("ICE 서버:", iceServers);

        pc = new RTCPeerConnection({ iceServers });
        pc.oniceconnectionstatechange = () => {
            console.log('ICE 상태:', pc.iceConnectionState);
            iceState.innerText = pc.iceConnectionState;
        };
        pc.onconnectionstatechange = () => {
            console.log('연결 상태:', pc.connectionState);
            connectState.innerText = pc.connectionState;
        };

        pc.ondatachannel = (event) => {
            dataChannel = event.channel;
            console.log("Data channel received:", dataChannel);
            dataChannel.onopen = () => console.log("Data channel is open");
            dataChannel.onclose = () => console.log("Data channel is closed");
            dataChannel.onmessage = (event) => {
                const chat = document.getElementById('chat');
                chat.innerHTML += `<div>상대: ${event.data}</div>`;
            };
        };

        connect.onclick = async function () {
            // pc.createOffer()
            // .then(offer => pc.setLocalDescription(offer))
            // .then(() => socket.emit('offer', pc.localDescription));

            if (!dataChannel) {
                dataChannel = await pc.createDataChannel("chat");
                dataChannel.onopen = () => console.log("Data channel is open");
                dataChannel.onclose = () => console.log("Data channel is closed");
                dataChannel.onmessage = (event) => {
                    const chat = document.getElementById('chat');
                    chat.innerHTML += `<div>상대: ${event.data}</div>`;
                };
            }

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            console.log("setLocalDescription", offer);
            socket.emit('offer', offer);
            console.log("내 offer 전송", offer);
        };

        sendMessage.onclick = async function () {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            await dataChannel.send(message);
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div>나: ${message}</div>`;
        };

        socket.on('ID', json => {
            myID.innerText = "내 아이디: " + json.myid;
            otherID.innerText = "상대 아이디: " + json.otherid;
        });

        socket.on('offer', async function (offer) {
            console.log("상대방 offer 수신", offer);
            await pc.setRemoteDescription(new RTCSessionDescription(offer))
            console.log("setRemoteDescription", offer);
            // .then(() => pc.createAnswer())
            // .then(answer => pc.setLocalDescription(answer))
            // .then(() => socket.emit('answer', answer));
            pc.onicecandidate = (event) => {
                console.log("ICE candidate 생성", event.candidate);
                if (event.candidate)
                    socket.emit('ice_candidate', event.candidate);
            };

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            console.log("setLocalDescription", answer);
            socket.emit('answer', answer);
            console.log("내 answer 전송", answer);
        });

        socket.on('answer', async function (answer) {
            console.log("상대방 answer 수신", answer);
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            console.log("setRemoteDescription", answer);
            pc.onicecandidate = (event) => {
                console.log("ICE candidate 생성", event.candidate);
                if (event.candidate)
                    socket.emit('ice_candidate', event.candidate);
            };

        });

        socket.on('ice_candidate', ice => {
            console.log("ICE candidate 수신", ice);
            pc.addIceCandidate(new RTCIceCandidate(ice))
        });


    </script>

</body>

</html>
